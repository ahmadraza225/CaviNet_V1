name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cavinet
          POSTGRES_PASSWORD: cavinet
          POSTGRES_DB: cavinet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cavinet -d cavinet_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cavinet:cavinet@localhost:5432/cavinet_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      - name: Install
        run: pip install -e ./ml -e "./backend[dev]"
      - name: Lint
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
      - name: Test (unit + integration)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  ml:
    name: ML package (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install
        run: pip install -e "./ml[dev]"
      - name: Lint
        run: |
          ruff check ml
          ruff format --check ml
      - name: Test
        working-directory: ml
        run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  stack:
    name: Full stack (make up + health check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start every service with make up
        run: make up
      - name: Check the web app and the API through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<title>CaviNet</title>"
          curl -fsS http://localhost:8080/api/health | tee health.json
          grep -q '"database":"ok"' health.json
          grep -q '"redis":"ok"' health.json
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
