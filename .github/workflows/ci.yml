name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cavinet
          POSTGRES_PASSWORD: cavinet
          POSTGRES_DB: cavinet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cavinet -d cavinet_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cavinet:cavinet@localhost:5432/cavinet_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.8,<3"
          pip install -e ./ml -e "./backend[dev]"
      - name: Lint
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
      - name: Test (unit + integration)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  ml:
    name: ML package (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install (with the training toolkit)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.8,<3"
          pip install -e "./ml[dev,train]"
      - name: Cache the lungmask R231 weights
        uses: actions/cache@v4
        with:
          path: ~/lungmask
          key: lungmask-r231-d5d2fc3d
      - name: Download the lungmask R231 weights (for the real segmenter test)
        run: |
          mkdir -p ~/lungmask
          f=~/lungmask/unet_r231-d5d2fc3d.pth
          [ -f "$f" ] || curl -fsSL -o "$f" \
            https://github.com/JoHof/lungmask/releases/download/v0.0/unet_r231-d5d2fc3d.pth
          echo "d5d2fc3df432115933491f115b283e94d1f5c841c0e82f6e7bd2d65d3ccde69f  $f" | sha256sum -c
          echo "LUNGMASK_WEIGHTS=$f" >> "$GITHUB_ENV"
      - name: Lint
        run: |
          ruff check ml
          ruff format --check ml
      - name: Test (includes the synthetic end-to-end training pipeline, Phase 6)
        working-directory: ml
        env:
          CAVINET_E2E_OUT: ${{ runner.temp }}/toolkit-e2e
        run: pytest --cov --cov-report=term-missing
      - name: Keep the synthetic evaluation report, figures and model card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-e2e-synthetic-report
          path: ${{ runner.temp }}/toolkit-e2e
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  audit:
    name: Dependency vulnerability scan (NFR-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
      - name: Python packages of the application and the training toolkit (pip-audit)
        run: |
          pip install --upgrade pip "setuptools>=83"
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.8,<3"
          pip install -e "./ml[train]" -e ./backend pip-audit
          pip-audit --skip-editable --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend packages shipped to the browser (npm audit; fails on high or critical)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Frontend build and test tools (report only; see docs/DEVELOPER_GUIDE.md, Security)
        working-directory: frontend
        run: |
          if ! npm audit; then
            echo "::warning title=npm audit::Advisories in build/test tools; they never ship to the browser. See docs/DEVELOPER_GUIDE.md (Security)."
          fi

  stack:
    name: Full stack (make up + health check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start every service with make up
        run: make up
      - name: Check the web app and the API through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q "<title>CaviNet</title>"
          curl -fsS http://localhost:8080/api/health | tee health.json
          grep -q '"database":"ok"' health.json
          grep -q '"redis":"ok"' health.json
      - name: Security headers and request size limits through nginx (NFR-2)
        run: |
          curl -fsS -D page.txt -o /dev/null http://localhost:8080/
          curl -fsS -D api.txt -o /dev/null http://localhost:8080/api/health
          cat page.txt api.txt
          for header in "content-security-policy: default-src 'self'; script-src 'self'" \
              "x-content-type-options: nosniff" "x-frame-options: DENY" \
              "referrer-policy: same-origin" "permissions-policy: camera=()" \
              "cross-origin-opener-policy: same-origin"; do
            for file in page.txt api.txt; do
              grep -qi "^$header" "$file" || { echo "$file is missing: $header"; exit 1; }
            done
          done
          grep -qi "^cache-control: no-store" api.txt   # API answers are never cached
          ! grep -qi "^server: nginx/" page.txt         # no version number
          # Ordinary API requests are limited to 16 MB, scan uploads to 1.5 GB (FR-04.1).
          refused() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -X POST \
              -H "Content-Type: $1" -H "Content-Length: $2" "http://localhost:8080$3")
            echo "$3 declaring $2 bytes: HTTP $code"; test "$code" = 413
          }
          refused application/json 17000000 /api/auth/login
          refused "multipart/form-data; boundary=x" 1700000000 \
            /api/patients/00000000-0000-0000-0000-000000000000/cases
      - name: Sign in as the first admin (FR-01.7) and the seeded demo doctor
        run: |
          set -a; source .env; set +a
          login() {
            curl -fsS -c cookies.txt -H "Content-Type: application/json" \
              -d "{\"email\":\"$1\",\"password\":\"$2\"}" http://localhost:8080/api/auth/login
          }
          login "$ADMIN_EMAIL" "$ADMIN_PASSWORD" | tee admin.json
          grep -q '"role":"admin"' admin.json
          grep -q '"must_change_password":true' admin.json
          grep -q cavinet_refresh cookies.txt
          make seed
          login "$DEMO_DOCTOR_EMAIL" "$DEMO_DOCTOR_PASSWORD" | tee doctor.json
          grep -q '"role":"doctor"' doctor.json
          token=$(sed 's/.*"access_token":"\([^"]*\)".*/\1/' doctor.json)
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" \
            http://localhost:8080/api/admin/users)
          test "$status" = "403"
      - name: The doctor creates, finds and deletes a patient (FR-02, FR-03, NFR-3)
        run: |
          set -a; source .env; set +a
          api=http://localhost:8080/api
          token=$(curl -fsS -H "Content-Type: application/json" \
            -d "{\"email\":\"$DEMO_DOCTOR_EMAIL\",\"password\":\"$DEMO_DOCTOR_PASSWORD\"}" \
            $api/auth/login | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
          auth="Authorization: Bearer $token"
          curl -fsS -H "$auth" -H "Content-Type: application/json" -d '{"full_name":
            "Ci Testpatient","mr_number":"ci-0001","date_of_birth":"1980-01-01","sex":"male"}' \
            $api/patients | tee patient.json
          grep -q '"mr_number":"CI-0001"' patient.json
          id=$(sed 's/.*"id":"\([^"]*\)".*/\1/' patient.json)
          curl -fsS -H "$auth" "$api/patients?q=testpatient" | grep -q '"total":1'
          curl -fsS -H "$auth" $api/dashboard/stats | grep -q '"total_patients":1'
          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }
          test "$(code -X DELETE -H "$auth" "$api/patients/$id")" = "422"
          test "$(code -X DELETE -H "$auth" "$api/patients/$id?confirm=CI-0001")" = "204"
          curl -fsS -H "$auth" $api/dashboard/stats | grep -q '"total_patients":0'
          # The search and the delete confirmation put identifiers in URLs; logs must not keep them.
          if docker compose logs backend frontend 2>&1 | grep -i -e testpatient -e ci-0001; then
            echo "Patient identifiers found in the service logs"; exit 1
          fi
      - name: The doctor uploads a synthetic scan and the AI analysis completes (FR-04, M-05, M-06)
        run: |
          set -a; source .env; set +a
          api=http://localhost:8080/api
          tmp=$(mktemp -d)
          field() { python3 -c "import json, sys; print(json.load(sys.stdin)$1)"; }
          token=$(curl -fsS -H "Content-Type: application/json" \
            -d "{\"email\":\"$DEMO_DOCTOR_EMAIL\",\"password\":\"$DEMO_DOCTOR_PASSWORD\"}" \
            $api/auth/login | field '["access_token"]')
          auth="Authorization: Bearer $token"
          patient=$(curl -fsS -H "$auth" -H "Content-Type: application/json" -d '{"full_name":
            "Ci Scanpatient","mr_number":"CI-0002","date_of_birth":"1970-01-01","sex":"female"}' \
            $api/patients | field '["id"]')
          docker compose exec -T backend python -m app.synthetic_dicom --slices 60 --size 64 \
            > "$tmp/scan.zip"
          curl -fsS -H "$auth" -F "files=@$tmp/scan.zip;type=application/zip" \
            "$api/patients/$patient/cases" > "$tmp/case.json"
          test "$(field '["status"]' < "$tmp/case.json")" = queued
          case_id=$(field '["id"]' < "$tmp/case.json")
          for _ in $(seq 1 120); do
            status=$(curl -fsS -H "$auth" "$api/cases/$case_id" | field '["status"]')
            [ "$status" = completed ] && break
            sleep 2
          done
          echo "final status: $status"
          curl -fsS -H "$auth" "$api/cases/$case_id" | tee "$tmp/done.json"
          test "$status" = completed
          label=$(field '["result"]["label"]' < "$tmp/done.json")
          [ "$label" = TB ] || [ "$label" = NTM ]
          test "$(field '["result"]["is_demo"]' < "$tmp/done.json")" = True
          curl -fsS -H "$auth" "$api/cases/$case_id/result" | tee "$tmp/result.json"
          test "$(field '["demo_banner"]' < "$tmp/result.json")" = "DEMO MODEL: NOT FOR CLINICAL USE"
          test "$(field '["preview_count"]' < "$tmp/result.json")" = 48
          curl -fsS -H "$auth" -o "$tmp/preview.png" "$api/cases/$case_id/previews/24"
          file "$tmp/preview.png" | grep -q "PNG image"
          curl -fsS -H "$auth" $api/model/status | grep -q '"is_demo":true'
          curl -fsS -H "$auth" $api/notifications/unread-count | grep -q '"count":1'
          curl -fsS -H "$auth" $api/dashboard/stats | grep -q '"completed_cases":1'
          # A scan with too few slices is refused with the documented reason.
          docker compose exec -T backend python -m app.synthetic_dicom --slices 30 --size 32 \
            > "$tmp/short.zip"
          curl -fsS -H "$auth" -F "files=@$tmp/short.zip" "$api/patients/$patient/cases" \
            | grep -q 'at least 50 are needed'
          # Stored files are de-identified and no staged original is left behind.
          docker compose exec -T backend sh -c \
            '! grep -rlF "SYNTHETIC^TESTPATIENT" /data/cases && [ -z "$(ls -A /data/staging)" ]'
          if docker compose logs backend worker frontend 2>&1 \
              | grep -i -e scanpatient -e ci-0002 -e testpatient; then
            echo "Patient identifiers found in the service logs"; exit 1
          fi
          # Deleting the patient removes the stored scan.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "$auth" \
            "$api/patients/$patient?confirm=CI-0002")
          test "$code" = 204
          docker compose exec -T backend sh -c "[ ! -e /data/cases/$case_id ]"
      - name: Time the analysis of a synthetic 300-slice scan on the CI CPU (NFR-1)
        run: docker compose exec -T worker python -m app.benchmark --slices 300
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
