[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cavinet-backend"
version = "0.6.0"
description = "CaviNet REST API and background worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "redis>=5,<7",
  "rq>=1.16,<3",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8,<3",
  "pydicom>=3.0,<4",
  "python-multipart>=0.0.18",
  "cavinet-ml",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx2>=2.0",
  "fakeredis>=2.23",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs real PostgreSQL and Redis (set TEST_DATABASE_URL and TEST_REDIS_URL)",
]
addopts = "-ra"
filterwarnings = [
  "error",
  # Third-party noise from the AI stack (MONAI, lungmask's dependencies, pickle protocol).
  "ignore:`torch.jit.interface` is deprecated:FutureWarning",
  "ignore::DeprecationWarning:monai.*",
  "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["app"]
