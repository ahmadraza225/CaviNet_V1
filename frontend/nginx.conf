server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Raised for CT uploads in Phase 4.
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Fingerprinted build assets can be cached for a long time.
    # (Use "expires", not add_header, inside locations: add_header there would drop
    # the security headers inherited from the server block.)
    location /assets/ {
        expires 30d;
    }

    # Single-page app: unknown paths are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
