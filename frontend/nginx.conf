# NFR-3: log the path without the query string (patient searches send names in `?q=`) and
# without the referrer (which carries the previous page's query string).
map $request_uri $path_only {
    ~^(?<path>[^?]*) $path;
}
log_format cavinet '$remote_addr - [$time_local] "$request_method $path_only $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log cavinet;

    root /usr/share/nginx/html;
    index index.html;

    # Raised for CT uploads in Phase 4.
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Fingerprinted build assets can be cached for a long time.
    # (Use "expires", not add_header, inside locations: add_header there would drop
    # the security headers inherited from the server block.)
    location /assets/ {
        expires 30d;
    }

    # Single-page app: unknown paths are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
