# NFR-3: log the path without the query string (patient searches send names in `?q=`) and
# without the referrer (which carries the previous page's query string).
map $request_uri $path_only {
    ~^(?<path>[^?]*) $path;
}
log_format cavinet '$remote_addr - [$time_local] "$request_method $path_only $server_protocol" '
                   '$status $body_bytes_sent "$http_user_agent"';

# The web app: scripts, styles and data only from CaviNet itself (no inline code, no other
# sites); previews are blob: URLs. React sets inline styles through the DOM, which CSP allows.
map $uri $content_security_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    # FastAPI's interactive API docs load Swagger UI from a CDN and start it with an inline script.
    /api/docs "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log cavinet;

    root /usr/share/nginx/html;
    index index.html;

    # Find the backend through Docker's DNS on every request (cached 10 s) rather than once at
    # start-up, so that nginx follows the backend when an update recreates its container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Ordinary API requests are small.
    client_max_body_size 16m;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy $content_security_policy always;

    # CT upload (FR-04.1): up to 1.5 GB of files plus form overhead. The body is streamed
    # to the backend as it arrives (no buffering to nginx's own disk), and the backend may
    # take a few minutes to check and de-identify a large scan before it answers.
    location ~ ^/api/patients/[^/]+/cases$ {
        client_max_body_size 1600m;
        proxy_request_buffering off;
        client_body_timeout 300s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Fingerprinted build assets can be cached for a long time.
    # (Use "expires", not add_header, inside locations: add_header there would drop
    # the security headers inherited from the server block.)
    location /assets/ {
        expires 30d;
    }

    # Single-page app: unknown paths are handled by the React router.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
